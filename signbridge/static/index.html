<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signbridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <h1>Signbridge</h1>
  <p id="modelState" class="pill">No model yet</p>
</header>

<main>
  <section class="stage" aria-label="Camera">
    <div class="frame">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <p id="camMsg" class="cam-msg">Starting camera…</p>
    </div>
    <div class="reading">
      <div class="big" id="liveLabel">–</div>
      <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
      <p id="liveHint">Hold a sign still to add it to your sentence.</p>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="sign">Sign to text</button>
      <button role="tab" aria-selected="false" data-tab="voice">Voice to signs</button>
      <button role="tab" aria-selected="false" data-tab="teach">Signs & training</button>
    </div>

    <div class="view" id="view-sign">
      <div id="sentence" class="sentence" aria-live="polite"><span class="empty">Your sentence will appear here.</span></div>
      <div class="row">
        <button id="speakBtn" class="primary">Speak sentence</button>
        <button id="undoBtn">Remove last word</button>
        <button id="clearBtn">Clear</button>
      </div>
      <h2>Recent</h2>
      <ul id="history" class="history"></ul>
    </div>

    <div class="view" id="view-voice" hidden>
      <div class="row">
        <button id="listenBtn" class="primary">Start listening</button>
        <select id="lang" aria-label="Spoken language">
          <option value="en-US">English</option><option value="sq-AL">Shqip</option>
          <option value="es-ES">Español</option><option value="de-DE">Deutsch</option>
          <option value="fr-FR">Français</option><option value="tr-TR">Türkçe</option>
        </select>
      </div>
      <div id="heard" class="heard" aria-live="polite">Say something and it will be shown in signs.</div>
      <form id="typeForm" class="row"><input id="typeIn" placeholder="Or type a phrase" autocomplete="off"><button>Show signs</button></form>
      <div id="tiles" class="tiles"></div>
    </div>

    <div class="view" id="view-teach" hidden>
      <form id="recForm" class="row">
        <input id="recLabel" placeholder="Word or letter to teach" maxlength="40" required>
        <button id="recBtn" class="primary">Record 2 seconds</button>
      </form>
      <ul id="labels" class="labels"></ul>
      <div class="row"><button id="trainBtn" class="primary">Train model</button><span id="trainMsg" class="note"></span></div>
      <div id="scores" class="scores"></div>
    </div>
  </section>
</main>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="/static/app.js"></script>
</body>
</html>
